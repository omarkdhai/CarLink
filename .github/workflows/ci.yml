# CarLink CI — backend + frontend build and tests, Docker images, image scan.
#
# Security plan S-19: least-privilege token (contents: read), every action
# pinned to a full commit SHA (the tag is in the trailing comment; Dependabot
# keeps both current), and the built images scanned with Trivy.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Testcontainers starts real Postgres + Redis; hosted runners provide Docker.
      - name: Run tests (Maven verify)
        working-directory: backend
        run: mvn -B -ntp verify

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/**/*.txt
          retention-days: 14

  frontend:
    name: Frontend lint + test + build + audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Shipped dependencies only; dev tooling never reaches the browser.
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker image ${{ matrix.service }} + Trivy
    runs-on: ubuntu-latest
    needs: [test, frontend]
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.service }}
          push: false
          load: true
          tags: carlink-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Report HIGH + CRITICAL in the log, fail only on a CRITICAL that has a fix.
      - name: Trivy image scan (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          trivyignores: .trivyignore.yaml
          image-ref: carlink-${{ matrix.service }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '0'

      - name: Trivy image scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          trivyignores: .trivyignore.yaml
          image-ref: carlink-${{ matrix.service }}:ci
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'
          skip-setup-trivy: true
