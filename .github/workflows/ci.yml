# CarLink CI — backend build, tests (Testcontainers), and Docker image build.
#
# Runs on every push/PR. Testcontainers spins up real Postgres + Redis;
# the builder image compiles the backend with Java 17.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # LoginAttemptService / rate limiter etc. hit Redis via Testcontainers;
      # the shared Postgres container approach in AbstractIntegrationTest
      # relies on Docker, which hosted runners provide for free.
      - name: Run tests (Maven verify)
        working-directory: backend
        run: mvn -B -ntp verify

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/**/*.txt
          retention-days: 14

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Verify the multi-stage Dockerfile compiles the jar and ships a
      # working image. Cache Maven deps inside the image layers.
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: carlink:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max