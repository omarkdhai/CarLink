# CarLink release — publish versioned images to GitHub Container Registry.
#
# Push a tag such as v1.0.0 (git tag v1.0.0 && git push origin v1.0.0):
#   1. the full CI runs on the tagged commit (tests, lint, Trivy, promtool);
#   2. both images are built, scanned again, and pushed as
#      ghcr.io/<owner>/carlink-backend:1.0.0 and carlink-frontend:1.0.0
#      (plus an immutable sha-<commit> tag).
# The servers then run `docker compose pull` with CARLINK_VERSION=1.0.0
# (docs/deploymentProcess.md B1, docs/deployment.md §4). Rolling back means
# deploying the previous version tag; nothing is rebuilt on the server.
#
# Same rules as CI (S-19): actions pinned to commit SHAs, least privilege.
# Only the publish job may write packages.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish ${{ matrix.service }} image
    runs-on: ubuntu-latest
    needs: [ci]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image names
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.ref_name }}
          SERVICE: ${{ matrix.service }}
        run: |
          owner="${OWNER,,}"                  # GHCR names must be lower-case
          version="${TAG#v}"                  # v1.0.0 -> 1.0.0
          image="ghcr.io/${owner}/carlink-${SERVICE}"
          {
            echo "image=${image}"
            echo "version=${version}"
            echo "tags=${image}:${version},${image}:sha-${GITHUB_SHA::12}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.service }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          # Links the package to this repository on GitHub.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}

      # The exact bytes that get pushed are scanned: a CRITICAL with a fix stops
      # the release.
      - name: Trivy image scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          trivyignores: .trivyignore.yaml
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'

      # Plain docker CLI instead of a login action: one fewer third-party action
      # with access to a write token. The token never touches the command line.
      - name: Push to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          for tag in ${TAGS//,/ }; do
            docker push "$tag"
          done
          docker logout ghcr.io
          echo "### Published \`${TAGS//,/\`, \`}\`" >> "$GITHUB_STEP_SUMMARY"
