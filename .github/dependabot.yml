# Dependency updates (security plan S-19). Minor/patch bumps are grouped per
# ecosystem to keep the PR count low; security updates always come on their own.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      maven-minor-patch:
        update-types: [minor, patch]
    ignore:
      # A Spring Boot major is a migration, not a bump (see security plan
      # S-07: 3.5 -> 4.1 needed Jackson 3, Security 7, Hibernate 7, TC 2).
      - dependency-name: org.springframework.boot:spring-boot-starter-parent
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
    ignore:
      # Base-image majors change the runtime itself (Java 17 LTS, Node 22 LTS):
      # move deliberately, with the pom / engines, never as a bot bump.
      - dependency-name: eclipse-temurin
        update-types: [version-update:semver-major]
      - dependency-name: maven
        update-types: [version-update:semver-major]
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Data-store majors need a migration plan (Postgres dump/restore; Redis 8
      # also changed its licence), not a bot bump.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
      - dependency-name: redis
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
