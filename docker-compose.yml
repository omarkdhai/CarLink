services:
  postgres:
    image: postgres:15-alpine
    container_name: carlink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carlink}
      POSTGRES_USER: ${POSTGRES_USER:-carlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carlink_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carlink} -d ${POSTGRES_DB:-carlink}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - carlink-network

  redis:
    image: redis:7-alpine
    container_name: carlink-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-carlink_redis_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-carlink_redis_password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - carlink-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carlink-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-carlink}
      POSTGRES_USER: ${POSTGRES_USER:-carlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carlink_dev_password}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-carlink}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-carlink_redis_password}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-in-production-please-32chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-only-refresh-secret-please-change-32chars}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:8080,http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - carlink-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: carlink-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - carlink-network

  mailhog:
    # Dev-only email catcher. Start with: docker compose --profile email up -d
    image: mailhog/mailhog:v1.0.1
    container_name: carlink-mailhog
    restart: unless-stopped
    profiles:
      - email
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"    # SMTP
      - "${MAILHOG_UI_PORT:-8025}:8025"      # Web UI
    networks:
      - carlink-network

volumes:
  postgres_data:
  redis_data:

networks:
  carlink-network:
    driver: bridge