# Local development stack (security plan S-01).
# - Secrets come from the untracked .env. Create/repair it once with:
#     node scripts/dev-secrets.mjs
# - Every port is published on 127.0.0.1 only: nothing here is reachable from
#   the network. Never expose this stack publicly; use docker-compose.prod.yml.
# Security plan S-20: every container gets no-new-privileges and starts with
# no Linux capabilities; services add back only what their entrypoint needs.
# Images are pinned by digest (Dependabot keeps them current).
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:15-alpine@sha256:23799e521dee9265a8b388ecf3bc0f1eaa34b95be67f5a76af4f8f6adb44c720
    <<: *hardened
    # The entrypoint chowns the data dir, then drops to the postgres user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    container_name: carlink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carlink}
      POSTGRES_USER: ${POSTGRES_USER:-carlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run node scripts/dev-secrets.mjs}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carlink} -d ${POSTGRES_DB:-carlink}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - carlink-network

  redis:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    <<: *hardened
    # The entrypoint walks and chowns /data (owned by redis), then drops to it.
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    container_name: carlink-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is not set - run node scripts/dev-secrets.mjs}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is not set - run node scripts/dev-secrets.mjs}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - carlink-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carlink-backend
    restart: unless-stopped
    <<: *hardened
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-carlink}
      POSTGRES_USER: ${POSTGRES_USER:-carlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run node scripts/dev-secrets.mjs}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-carlink}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is not set - run node scripts/dev-secrets.mjs}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set - run node scripts/dev-secrets.mjs}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:8080,http://localhost:5173}
      CONTACT_PROVIDER: ${CONTACT_PROVIDER:-mock}
      CONTACT_ENABLED_CHANNELS: ${CONTACT_ENABLED_CHANNELS:-SMS}
      TELNYX_API_KEY: ${TELNYX_API_KEY:-}
      TELNYX_SMS_FROM: ${TELNYX_SMS_FROM:-}
      TELNYX_VOICE_FROM: ${TELNYX_VOICE_FROM:-}
      TELNYX_CONNECTION_ID: ${TELNYX_CONNECTION_ID:-}
      TELNYX_VOICE_AUDIO_URL: ${TELNYX_VOICE_AUDIO_URL:-}
      # Cloudflare Turnstile on the public forms (security plan S-11)
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-false}
      CAPTCHA_SITE_KEY: ${CAPTCHA_SITE_KEY:-}
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-}
      # First admin, created on startup only if no account has this email.
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - carlink-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: carlink-frontend
    restart: unless-stopped
    <<: *hardened
    read_only: true
    tmpfs:
      - /tmp
    ports:
      # nginx runs unprivileged on 8080 inside the container (S-20).
      - "127.0.0.1:${FRONTEND_PORT:-80}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - carlink-network

  mailhog:
    # Dev-only email catcher. Start with: docker compose --profile email up -d
    image: mailhog/mailhog:v1.0.1@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
    container_name: carlink-mailhog
    <<: *hardened
    restart: unless-stopped
    profiles:
      - email
    ports:
      - "127.0.0.1:${MAILHOG_SMTP_PORT:-1025}:1025"    # SMTP
      - "127.0.0.1:${MAILHOG_UI_PORT:-8025}:8025"      # Web UI
    networks:
      - carlink-network

volumes:
  postgres_data:
  redis_data:

networks:
  carlink-network:
    driver: bridge
    # Deliberately NOT 172.28.0.0/24: that range is the prod network whose
    # members nginx trusts for X-Forwarded-For (see frontend/nginx.conf).
    ipam:
      config:
        - subnet: 172.30.0.0/24