# ============================================
# CarLink — production stack
# Usage:  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Required env (see .env.example): CARLINK_VERSION, POSTGRES_PASSWORD, REDIS_PASSWORD,
# JWT_SECRET, PHONE_ENCRYPTION_KEY, MAIL_HOST, MAIL_USERNAME, MAIL_PASSWORD,
# APP_BASE_URL, APP_PUBLIC_URL, CARLINK_DOMAIN, ACME_EMAIL.
# ============================================

# Memory limits are sized for one 4 GB server (docs/deploymentProcess.md):
# backend 1536m + postgres 512m + redis 192m + nginx 64m + caddy 128m ~ 2.4 GB,
# leaving room for the OS. On a bigger server raise them; nothing else changes.
# memswap_limit = mem_limit: a container never pushes the others into swap.

# Docker's default json-file driver has no size cap, so a chatty container fills
# the disk until the host dies. Applied to every service below.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Security plan S-20: every container gets no-new-privileges and starts with
# no Linux capabilities; services add back only what their entrypoint needs.
# Images are pinned by digest (Dependabot keeps them current).
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:15-alpine@sha256:23799e521dee9265a8b388ecf3bc0f1eaa34b95be67f5a76af4f8f6adb44c720
    <<: *hardened
    # The entrypoint chowns the data dir, then drops to the postgres user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carlink}
      POSTGRES_USER: ${POSTGRES_USER:-carlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carlink} -d ${POSTGRES_DB:-carlink}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - carlink-network

  redis:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    <<: *hardened
    # The entrypoint walks and chowns /data (owned by redis), then drops to it.
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 192m
    memswap_limit: 192m
    # Explicit cap instead of growing until the container is killed. noeviction
    # keeps rate-limit counters (evicting them would weaken abuse limits);
    # CarLink stores a few KB per active visitor, far below 64 MB.
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - carlink-network

  backend:
    # Released image (release.yml). The server only pulls; `build` stays for a
    # local dry-run: CARLINK_VERSION=local docker compose ... up -d --build
    image: ${CARLINK_REGISTRY:-ghcr.io/omarkdhai}/carlink-backend:${CARLINK_VERSION:?CARLINK_VERSION is required (release, e.g. 1.0.0)}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    <<: *hardened
    read_only: true
    tmpfs:
      - /tmp
    # Bound to loopback on purpose. nginx reaches the backend over the internal
    # network by service name, so publishing the port to 0.0.0.0 would only add
    # a second, unfiltered way in -- straight to the API and /actuator,
    # bypassing every nginx location block. To reach the API from another host,
    # exec into the container instead of re-exposing the port.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    # Let in-flight requests finish before SIGKILL, so a redeploy does not
    # sever a scan mid-submission.
    stop_grace_period: 30s
    mem_limit: 1536m
    memswap_limit: 1536m
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Heap = 60 % of the container limit (~920 MB); the rest is metaspace,
      # threads and buffers. On OutOfMemoryError exit, so Docker restarts a
      # clean JVM instead of leaving a half-broken one running.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError"
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-carlink}
      POSTGRES_USER: ${POSTGRES_USER:-carlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PHONE_ENCRYPTION_KEY: ${PHONE_ENCRYPTION_KEY:?PHONE_ENCRYPTION_KEY is required (64 hex chars)}
      # Prometheus scrape credential for /actuator/prometheus (S-25); optional.
      METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}
      MAIL_HOST: ${MAIL_HOST:?MAIL_HOST is required}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME is required}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD is required}
      # Port 465 speaks implicit TLS, so STARTTLS must stay off unless the
      # provider is reached on 587. Gmail needs auth either way.
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      # Envelope sender + Reply-To. Gmail only accepts a sender the
      # authenticated account owns, so this tracks MAIL_USERNAME until a
      # branded mailbox exists.
      MAIL_FROM: ${MAIL_FROM:-${MAIL_USERNAME}}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-${MAIL_USERNAME}}
      # The application default is the mock sender, which logs mail instead of
      # delivering it. Defaulting to smtp here means a forgotten variable
      # cannot silently swallow every verification and reset message.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      # Public links (QR, verification, password reset) are built from these.
      # Without them they fall back to localhost and reach nobody.
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL is required}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?APP_PUBLIC_URL is required}
      # nginx serves the SPA and the API from one origin, so CORS is normally
      # unnecessary; set this only if something calls the API cross-origin.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Where the public "Contact us" form is delivered.
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-hello@carlink.app}
      # mock until a real provider is configured (see .env.example for telnyx).
      CONTACT_PROVIDER: ${CONTACT_PROVIDER:-mock}
      CONTACT_ENABLED_CHANNELS: ${CONTACT_ENABLED_CHANNELS:-SMS}
      # Telnyx (only read when CONTACT_PROVIDER=telnyx)
      TELNYX_API_KEY: ${TELNYX_API_KEY:-}
      TELNYX_SMS_FROM: ${TELNYX_SMS_FROM:-}
      TELNYX_VOICE_FROM: ${TELNYX_VOICE_FROM:-}
      TELNYX_CONNECTION_ID: ${TELNYX_CONNECTION_ID:-}
      TELNYX_VOICE_AUDIO_URL: ${TELNYX_VOICE_AUDIO_URL:-}
      # Cloudflare Turnstile on the public forms (security plan S-11)
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-false}
      CAPTCHA_SITE_KEY: ${CAPTCHA_SITE_KEY:-}
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-}
      # Only meaningful once TLS terminates in front of the backend.
      HSTS_ENABLED: ${HSTS_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - carlink-network

  frontend:
    # Released image (release.yml). The server only pulls; `build` stays for a
    # local dry-run: CARLINK_VERSION=local docker compose ... up -d --build
    image: ${CARLINK_REGISTRY:-ghcr.io/omarkdhai}/carlink-frontend:${CARLINK_VERSION:?CARLINK_VERSION is required (release, e.g. 1.0.0)}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    <<: *hardened
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 64m
    memswap_limit: 64m
    # Not published: only the Caddy TLS edge talks to nginx (security plan S-02).
    # nginx runs unprivileged on 8080 (S-20).
    expose:
      - "8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - carlink-network

  # TLS edge (security plan S-02): automatic certificates for CARLINK_DOMAIN,
  # HTTP->HTTPS redirect, HSTS. The only service published to the internet.
  caddy:
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    logging: *default-logging
    <<: *hardened
    mem_limit: 128m
    memswap_limit: 128m
    # Binds 80/443.
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs:
      - /tmp
    environment:
      CARLINK_DOMAIN: ${CARLINK_DOMAIN:?CARLINK_DOMAIN is required (public hostname, e.g. carlink.tn)}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required (certificate expiry notices)}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - carlink-network

volumes:
  postgres_data:
  redis_data:
  # Certificates and ACME account: keep across redeploys (rate limits).
  caddy_data:
  caddy_config:

networks:
  carlink-network:
    driver: bridge
    # Fixed subnet: nginx trusts X-Forwarded-For only from this range, i.e.
    # from Caddy (set_real_ip_from in frontend/nginx.conf). Keep them in sync.
    ipam:
      config:
        - subnet: 172.28.0.0/24