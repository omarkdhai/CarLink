# ============================================
# CarLink — production stack
# Usage:  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Required env (see .env.example): POSTGRES_PASSWORD, REDIS_PASSWORD,
# JWT_SECRET, JWT_REFRESH_SECRET, MAIL_HOST, MAIL_USERNAME, MAIL_PASSWORD,
# APP_BASE_URL, APP_PUBLIC_URL.
# ============================================

# Docker's default json-file driver has no size cap, so a chatty container fills
# the disk until the host dies. Applied to every service below.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carlink}
      POSTGRES_USER: ${POSTGRES_USER:-carlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carlink} -d ${POSTGRES_DB:-carlink}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - carlink-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - carlink-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    # Bound to loopback on purpose. nginx reaches the backend over the internal
    # network by service name, so publishing the port to 0.0.0.0 would only add
    # a second, unfiltered way in -- straight to the API and /actuator,
    # bypassing every nginx location block. To reach the API from another host,
    # exec into the container instead of re-exposing the port.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    # Let in-flight requests finish before SIGKILL, so a redeploy does not
    # sever a scan mid-submission.
    stop_grace_period: 30s
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-carlink}
      POSTGRES_USER: ${POSTGRES_USER:-carlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      MAIL_HOST: ${MAIL_HOST:?MAIL_HOST is required}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME is required}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD is required}
      # The application default is the mock sender, which logs mail instead of
      # delivering it. Defaulting to smtp here means a forgotten variable
      # cannot silently swallow every verification and reset message.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      # Public links (QR, verification, password reset) are built from these.
      # Without them they fall back to localhost and reach nobody.
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL is required}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?APP_PUBLIC_URL is required}
      # nginx serves the SPA and the API from one origin, so CORS is normally
      # unnecessary; set this only if something calls the API cross-origin.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Where the public "Contact us" form is delivered.
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-hello@carlink.app}
      # mock until a real provider is configured (see .env.example for twilio).
      CONTACT_PROVIDER: ${CONTACT_PROVIDER:-mock}
      # Only meaningful once TLS terminates in front of the backend.
      HSTS_ENABLED: ${HSTS_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - carlink-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - carlink-network

volumes:
  postgres_data:
  redis_data:

networks:
  carlink-network:
    driver: bridge