# ============================================
# CarLink — integration-test profile
# Overrides build dynamic properties via
# AbstractIntegrationTest (Testcontainers).
# ============================================

spring:
  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  mail:
    host: localhost
    port: 1025

carlink:
  monitoring:
    scrape-token: integration-test-scrape-token-0123456789abcdef
  crypto:
    # Test-only key (S-17).
    phone-key: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
  jwt:
    secret: integration-test-secret-key-at-least-32-characters-long!!
    access-expiration-minutes: 15
    refresh-expiration-days: 7

  conversation:
    expiry-hours: 24

  qr:
    token-bytes: 32

  ratelimit:
    ip-per-minute: 100
    qr-per-hour: 100
    # Shared-IP Testcontainers suite: reports must not trip the per-IP limiter.
    report-ip-per-minute: 1000
    # Same for guest order minting.
    order-ip-per-minute: 1000

  # The whole suite shares one client IP (127.0.0.1) and one Redis: the
  # S-03/S-04 throttles are lifted here and exercised by AuthThrottleIntegrationTest.
  throttle:
    register-ip:
      max: 100000
      window-seconds: 60
    password-reset-ip:
      max: 100000
      window-seconds: 60
    password-reset-email:
      max: 100000
      window-seconds: 60
    password-reset-confirm-ip:
      max: 100000
      window-seconds: 60
    verify-email-ip:
      max: 100000
      window-seconds: 60
    refresh-ip:
      max: 100000
      window-seconds: 60
    sticker-activate-user:
      max: 100000
      window-seconds: 60
    sticker-activate-ip:
      max: 100000
      window-seconds: 60
    login-ip:
      max: 100000
      window-seconds: 60
    relay-visitor-cooldown:
      max: 100000
      window-seconds: 60
    relay-sticker-day:
      max: 100000
      window-seconds: 60
    relay-owner-day:
      max: 100000
      window-seconds: 60
    order-email-day:
      max: 100000
      window-seconds: 60
    order-mobile-day:
      max: 100000
      window-seconds: 60
    login-account-failures:
      max: 100000
      window-seconds: 60
  contact:
    provider: mock
    enabled-channels: SMS

  security:
    cors-allowed-origins: http://localhost:5173

logging:
  level:
    com.carlink: INFO