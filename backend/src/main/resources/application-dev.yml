# ============================================
# CarLink — development profile
# ============================================

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:carlink}
    username: ${POSTGRES_USER:carlink}
    password: ${POSTGRES_PASSWORD:carlink_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:carlink_redis_password}
      timeout: 2000ms

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

carlink:
  # Dev-only initial administrator (created on startup if absent).
  admin:
    bootstrap-email: admin@carlink.local
    bootstrap-password: ChangeMe123!
  # The React SPA (Vite dev server) owns /c/*, /verify-email and /reset-password.
  base-url: ${APP_BASE_URL:http://localhost:5173}
  public-url: ${APP_PUBLIC_URL:http://localhost:5173}

logging:
  level:
    com.carlink: DEBUG
    org.hibernate.SQL: DEBUG