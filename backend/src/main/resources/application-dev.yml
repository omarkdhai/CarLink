# ============================================
# CarLink — development profile
# ============================================

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:carlink}
    username: ${POSTGRES_USER:carlink}
    # No committed fallback (security plan S-01): set it in .env.
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

carlink:
  # Plain http://localhost: a Secure cookie would be dropped by some browsers.
  auth:
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
  # Initial administrator, created on startup only if absent. Both values come
  # from the untracked .env (node scripts/dev-secrets.mjs) -- never commit them.
  admin:
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
    bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  # The React SPA (Vite dev server) owns /c/*, /verify-email and /reset-password.
  base-url: ${APP_BASE_URL:http://localhost:5173}
  public-url: ${APP_PUBLIC_URL:http://localhost:5173}

logging:
  level:
    com.carlink: DEBUG
    org.hibernate.SQL: DEBUG