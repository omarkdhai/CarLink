# ============================================
# CarLink — main application configuration
# ============================================

spring:
  application:
    name: carlink-backend

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    # Never let Hibernate create schema in production
    baseline-version: 0

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    open-in-view: false

  # Jackson
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

  # Email
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Server
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      # Only DB, Redis and disk drive the overall health status.
      # SMTP (MailHog) may be absent in dev without affecting app health.
      probes:
        enabled: true
  health:
    mail:
      enabled: false

# ============================================
# CarLink application settings
# ============================================
carlink:
  # Base URL used to build the public QR links
  base-url: ${APP_BASE_URL:http://localhost:8080}
  # Public frontend origin (used for building links / CORS)
  public-url: ${APP_PUBLIC_URL:http://localhost:4200}

  jwt:
    # Access token (short-lived)
    secret: ${JWT_SECRET:dev-only-change-me-in-production-please-32chars}
    access-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:15}
    # Refresh token (long-lived)
    refresh-secret: ${JWT_REFRESH_SECRET:dev-only-refresh-secret-please-change-32chars}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}

  # Conversation / contact
  conversation:
    expiry-hours: ${CONVERSATION_EXPIRY_HOURS:24}

  # QR code
  qr:
    # Number of random bytes for the public token (64 hex chars)
    token-bytes: 32

  # Rate limiting (Redis-backed)
  ratelimit:
    ip-per-minute: ${RATE_LIMIT_IP_PER_MINUTE:5}
    qr-per-hour: ${RATE_LIMIT_QR_PER_HOUR:20}
    capture-hosts: https://www.google.com/recaptcha/api/siteverify,https://hcaptcha.com
    # Login brute-force protection
    max-login-failures: ${RATE_LIMIT_MAX_LOGIN_FAILURES:5}
    login-lock-minutes: ${RATE_LIMIT_LOGIN_LOCK_MINUTES:15}

  # Contact channel provider
  contact:
    provider: ${CONTACT_PROVIDER:mock}

  # Email: mock (logs the message — dev, MailHog substitute) or smtp
  email:
    provider: ${EMAIL_PROVIDER:mock}
    token-expiry-minutes: ${EMAIL_TOKEN_EXPIRY_MINUTES:60}

  # Security
  security:
    # Allowed CORS origins
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080}

logging:
  level:
    com.carlink: INFO
    org.springframework.boot: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %logger{36} - %msg%n"