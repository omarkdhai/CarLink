# ============================================
# CarLink — main application configuration
# ============================================

spring:
  application:
    name: carlink-backend

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    # Never let Hibernate create schema in production
    baseline-version: 0

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    open-in-view: false

  # Jackson
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

  # Email
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Server
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# Actuator
management:
  # Metrics export is off unless asked for. Without this the actuator only ever
  # builds a SimpleMeterRegistry, so the prometheus endpoint named in the
  # exposure list below did not exist and 404'd.
  defaults:
    metrics:
      export:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        # prometheus and metrics are authenticated (they fall through to
        # anyRequest().authenticated()), so only health/info are public.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      # Only DB, Redis and disk drive the overall health status.
      # SMTP (MailHog) may be absent in dev without affecting app health.
      probes:
        enabled: true
  health:
    mail:
      enabled: false

# ============================================
# CarLink application settings
# ============================================
carlink:
  # Base URL used to build the public QR links
  base-url: ${APP_BASE_URL:http://localhost:8080}
  # Public frontend origin (used for building links / CORS).
  # 5173 is the Vite dev server. This used to default to :4200, the Angular
  # dev-server port, which nothing in this project serves -- any profile that
  # did not override it produced QR links pointing nowhere.
  public-url: ${APP_PUBLIC_URL:http://localhost:5173}

  jwt:
    # Access token (short-lived)
    secret: ${JWT_SECRET:dev-only-change-me-in-production-please-32chars}
    access-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:15}
    # Refresh token (long-lived)
    refresh-secret: ${JWT_REFRESH_SECRET:dev-only-refresh-secret-please-change-32chars}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}

  # Conversation / contact
  conversation:
    expiry-hours: ${CONVERSATION_EXPIRY_HOURS:24}
    # How often the expired-conversation sweeper runs (default: once an hour)
    sweep-interval-ms: ${CONVERSATION_SWEEP_INTERVAL_MS:3600000}

  # QR code
  qr:
    # Number of random bytes for the public token (64 hex chars)
    token-bytes: 32

  # Rate limiting (Redis-backed)
  ratelimit:
    ip-per-minute: ${RATE_LIMIT_IP_PER_MINUTE:5}
    qr-per-hour: ${RATE_LIMIT_QR_PER_HOUR:20}
    capture-hosts: https://www.google.com/recaptcha/api/siteverify,https://hcaptcha.com
    # Login brute-force protection
    max-login-failures: ${RATE_LIMIT_MAX_LOGIN_FAILURES:5}
    login-lock-minutes: ${RATE_LIMIT_LOGIN_LOCK_MINUTES:15}
    # Anonymous report filings, per IP per minute
    report-ip-per-minute: ${RATE_LIMIT_REPORT_IP_PER_MINUTE:10}
    # Guest ordering (COD): raw sticker tokens + QR images are returned once,
    # so the mint is rate-limited per IP per minute.
    order-ip-per-minute: ${RATE_LIMIT_ORDER_IP_PER_MINUTE:5}

  # Contact channel provider
  contact:
    provider: ${CONTACT_PROVIDER:mock}

  # Public "Contact us" form → business mailbox
  contact-form:
    to-email: ${CONTACT_TO_EMAIL:hello@carlink.app}
    # Per-IP per-minute submissions (guarded before the SMTP send)
    ip-per-minute: ${RATE_LIMIT_CONTACT_IP_PER_MINUTE:3}

  # Email. The default is the mock sender, which only logs the message. That is
  # right for dev and dangerous for production: verification and password-reset
  # mails would be silently dropped. The prod compose file overrides this to
  # smtp so the mock cannot be reached by accident.
  email:
    provider: ${EMAIL_PROVIDER:mock}
    token-expiry-minutes: ${EMAIL_TOKEN_EXPIRY_MINUTES:60}

  # Security
  security:
    # Allowed CORS origins (the Vite SPA dev server and the packaged app).
    # Blank entries are ignored, so an unset value in production means "no
    # cross-origin callers", which is correct when nginx serves both the SPA
    # and the API from one origin.
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:8080}
    # Send HSTS. Left off by default: it is meaningless over plain HTTP and
    # includeSubDomains cannot be withdrawn once a browser has cached it.
    # Enable once TLS is terminated in front of the app.
    hsts-enabled: ${HSTS_ENABLED:false}

  # Initial ADMIN bootstrap (disabled by default; dev profile sets credentials)
  admin:
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
    bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:}

logging:
  level:
    com.carlink: INFO
    org.springframework.boot: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %logger{36} - %msg%n"