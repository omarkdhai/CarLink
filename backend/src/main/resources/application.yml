# ============================================
# CarLink — main application configuration
# ============================================

spring:
  application:
    name: carlink-backend

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    # Never let Hibernate create schema in production
    baseline-version: 0

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    open-in-view: false

  # Jackson
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

  # Email
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          # MailHog in dev needs neither; Gmail/other providers need both.
          # Set MAIL_SMTP_AUTH=true and MAIL_SMTP_STARTTLS=true for Gmail.
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Server
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# Actuator
management:
  # Metrics export is off unless asked for. Without this the actuator only ever
  # builds a SimpleMeterRegistry, so the prometheus endpoint named in the
  # exposure list below did not exist and 404'd.
  defaults:
    metrics:
      export:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        # prometheus and metrics are authenticated (they fall through to
        # anyRequest().authenticated()), so only health/info are public.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      # Only DB, Redis and disk drive the overall health status.
      # SMTP (MailHog) may be absent in dev without affecting app health.
      probes:
        enabled: true
      group:
        # With probes enabled, Spring's readiness group contains only
        # readinessState by default, so it reports UP even when Postgres or
        # Redis is unreachable -- the app cannot serve a scan or rate-limit
        # anything in that state. Naming db and redis makes readiness mean
        # "can actually do work", which is what an orchestrator should route on.
        # Liveness is deliberately left to Spring's default: it reports DOWN
        # only if the JVM itself is broken, and must not flap when a
        # dependency fails or a restart loop becomes the outage.
        readiness:
          include: readinessState,db,redis
        liveness:
          include: livenessState
  health:
    mail:
      enabled: false

# ============================================
# CarLink application settings
# ============================================
carlink:
  # Base URL used to build the public QR links
  base-url: ${APP_BASE_URL:http://localhost:8080}
  # Public frontend origin (used for building links / CORS).
  # 5173 is the Vite dev server. This used to default to :4200, the Angular
  # dev-server port, which nothing in this project serves -- any profile that
  # did not override it produced QR links pointing nowhere.
  public-url: ${APP_PUBLIC_URL:http://localhost:5173}

  jwt:
    # Access token (short-lived)
    # Required, no default (security plan S-01): a committed fallback let anyone
    # forge tokens for any instance started without JWT_SECRET. Locally it comes
    # from .env (node scripts/dev-secrets.mjs); tests set their own.
    secret: ${JWT_SECRET}
    access-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:15}
    # Admin access tokens are shorter-lived (security plan S-10)
    admin-access-expiration-minutes: ${JWT_ADMIN_ACCESS_EXPIRATION_MINUTES:5}
    # Refresh token (long-lived)
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}

  # Owners' phone numbers are encrypted at rest with this AES-256 key
  # (security plan S-17): 64 hex characters, required, never rotate casually.
  crypto:
    phone-key: ${PHONE_ENCRYPTION_KEY:}

  # Data retention (security plan S-17), run daily by RetentionService.
  retention:
    enabled: ${RETENTION_ENABLED:true}
    cron: ${RETENTION_CRON:0 30 3 * * *}
    conversation-days: ${RETENTION_CONVERSATION_DAYS:90}
    token-grace-days: ${RETENTION_TOKEN_GRACE_DAYS:7}
    ip-days: ${RETENTION_IP_DAYS:90}
    contact-message-days: ${RETENTION_CONTACT_MESSAGE_DAYS:365}

  password:
    # Breached-password check (security plan S-14); on in the prod profile.
    breach-check: ${PASSWORD_BREACH_CHECK:false}

  auth:
    # The refresh token travels in an HttpOnly, SameSite=Strict cookie
    # (security plan S-09). Secure (HTTPS-only) everywhere except the dev
    # profile, which is served over plain http://localhost.
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}

  # Conversation / contact
  conversation:
    expiry-hours: ${CONVERSATION_EXPIRY_HOURS:24}
    # How often the expired-conversation sweeper runs (default: once an hour)
    sweep-interval-ms: ${CONVERSATION_SWEEP_INTERVAL_MS:3600000}

  # QR code
  qr:
    # Number of random bytes for the public token (64 hex chars)
    token-bytes: 32

  # Rate limiting (Redis-backed)
  ratelimit:
    ip-per-minute: ${RATE_LIMIT_IP_PER_MINUTE:5}
    qr-per-hour: ${RATE_LIMIT_QR_PER_HOUR:20}
    capture-hosts: https://www.google.com/recaptcha/api/siteverify,https://hcaptcha.com
    # Login brute-force protection
    max-login-failures: ${RATE_LIMIT_MAX_LOGIN_FAILURES:5}
    login-lock-minutes: ${RATE_LIMIT_LOGIN_LOCK_MINUTES:15}
    # Anonymous report filings, per IP per minute
    report-ip-per-minute: ${RATE_LIMIT_REPORT_IP_PER_MINUTE:10}
    # Guest ordering (COD): raw sticker tokens + QR images are returned once,
    # so the mint is rate-limited per IP per minute.
    order-ip-per-minute: ${RATE_LIMIT_ORDER_IP_PER_MINUTE:5}

  # Contact relay
  contact:
    provider: ${CONTACT_PROVIDER:mock}
    # Channels advertised on the public page and accepted by the submit
    # endpoint. SMS-only by default: WhatsApp on Telnyx requires an approved
    # template outside the 24-hour window, which never applies to an
    # unprompted QR scan.
    enabled-channels: ${CONTACT_ENABLED_CHANNELS:SMS}

  # Public "Contact us" form → business mailbox
  contact-form:
    to-email: ${CONTACT_TO_EMAIL:hello@carlink.app}
    # Per-IP per-minute submissions (guarded before the SMTP send)
    ip-per-minute: ${RATE_LIMIT_CONTACT_IP_PER_MINUTE:3}

  # Email. The default is the mock sender, which only logs the message. That is
  # right for dev and dangerous for production: verification and password-reset
  # mails would be silently dropped. The prod compose file overrides this to
  # smtp so the mock cannot be reached by accident.
  email:
    provider: ${EMAIL_PROVIDER:mock}
    token-expiry-minutes: ${EMAIL_TOKEN_EXPIRY_MINUTES:60}
    # Envelope sender and Reply-To. No personal default (security plan S-22):
    # set MAIL_FROM to an address the SMTP account may send as (Gmail: the
    # account itself or an alias it owns). The .invalid placeholder can never
    # deliver, and the prod profile refuses to start with it.
    from: ${MAIL_FROM:no-reply@carlink.invalid}
    reply-to: ${MAIL_REPLY_TO:no-reply@carlink.invalid}

  # Security
  security:
    # Allowed CORS origins (the Vite SPA dev server and the packaged app).
    # Blank entries are ignored, so an unset value in production means "no
    # cross-origin callers", which is correct when nginx serves both the SPA
    # and the API from one origin.
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:8080}
    # Send HSTS. Left off by default: it is meaningless over plain HTTP and
    # includeSubDomains cannot be withdrawn once a browser has cached it.
    # Enable once TLS is terminated in front of the app.
    hsts-enabled: ${HSTS_ENABLED:false}

  # Bot protection for the public forms (Cloudflare Turnstile, security plan S-11).
  # Off by default; set all three to turn it on.
  captcha:
    enabled: ${CAPTCHA_ENABLED:false}
    site-key: ${CAPTCHA_SITE_KEY:}
    secret-key: ${CAPTCHA_SECRET_KEY:}

  # Initial ADMIN bootstrap (disabled by default; dev profile sets credentials)
  admin:
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
    bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:}

  # Telnyx. Only read when contact.provider=telnyx.
  telnyx:
    api-key: ${TELNYX_API_KEY:}
    sms-from: ${TELNYX_SMS_FROM:}
    voice-from: ${TELNYX_VOICE_FROM:}
    connection-id: ${TELNYX_CONNECTION_ID:}
    # Static clip played when the owner answers the alert call.
    voice-audio-url: ${TELNYX_VOICE_AUDIO_URL:}

logging:
  level:
    com.carlink: INFO
    org.springframework.boot: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %logger{36} - %msg%n"