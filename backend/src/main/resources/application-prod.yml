# ============================================
# CarLink — production profile
# ============================================

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://postgres:5432/carlink}
    username: ${POSTGRES_USER:carlink}
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      max-lifetime: 1800000

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  jpa:
    show-sql: false

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Production JWT secrets must come from environment variables —
# never hardcode them.
carlink:
  jwt:
    secret: ${JWT_SECRET:}
    refresh-secret: ${JWT_REFRESH_SECRET:}

logging:
  level:
    com.carlink: WARN