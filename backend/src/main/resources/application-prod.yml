# ============================================
# CarLink — production profile
# ============================================

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://postgres:5432/carlink}
    username: ${POSTGRES_USER:carlink}
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      max-lifetime: 1800000

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  jpa:
    show-sql: false

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Production JWT secrets must come from environment variables —
# never hardcode them.
carlink:
  jwt:
    secret: ${JWT_SECRET:}
    refresh-secret: ${JWT_REFRESH_SECRET:}
  security:
    # Enable only once TLS is actually terminated in front of the app.
    # Browsers ignore HSTS over plain HTTP, and includeSubDomains cannot be
    # withdrawn once a browser has cached it.
    hsts-enabled: ${HSTS_ENABLED:false}

# Do not publish the API surface in production. /v3/api-docs and /swagger-ui
# are permitAll, so leaving them on hands anonymous visitors every endpoint,
# DTO shape and validation constraint.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.carlink: WARN