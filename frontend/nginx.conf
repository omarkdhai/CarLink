server {
    listen 80;
    server_name localhost;

    # Do not advertise the nginx version (security plan S-06).
    server_tokens off;

    # Gzip compression for static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Serve static assets built by Vite
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # Browser security headers for the SPA (security plan S-06). Kept in
        # this location only: the /api/ responses carry the backend's own
        # headers, and nginx would otherwise send duplicates there.
        # CSP: the Vite build has no inline scripts; Google Fonts is the only
        # third party; data:/blob: cover QR images and file downloads.
        # upgrade-insecure-requests is added with TLS (S-02).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    # Reverse proxy API requests to the Spring Boot backend container
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append. $proxy_add_x_forwarded_for keeps whatever the
        # client sent and adds to it, so any caller could forge the value the
        # backend reads as its client IP and bypass every per-IP rate limit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy Swagger UI for interactive API documentation.
    # This file is shared by the dev and prod stacks. In dev springdoc is on,
    # so /swagger-ui/ works as documented. In prod the backend disables it via
    # springdoc.api-docs.enabled=false, and these paths 404 there — that profile
    # switch is the control, not this block.
    location /swagger-ui/ {
        proxy_pass http://backend:8080/swagger-ui/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /v3/api-docs {
        proxy_pass http://backend:8080/v3/api-docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Only the health endpoint is reachable from outside (security plan S-05).
    # Metrics and the Prometheus scrape stay on the internal network: scrape
    # them from inside (backend:8080) with an admin token, never through nginx.
    location = /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /actuator/health/ {
        proxy_pass http://backend:8080/actuator/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /actuator/ {
        return 404;
    }
}
